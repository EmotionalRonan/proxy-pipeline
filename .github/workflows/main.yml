name: Daily Proxy Node Update

on:
  schedule:
    # GitHub Actions 使用 UTC。北京时间 07:00 = UTC 23:00 前一天。
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发（调试用）

permissions:
  contents: write        # 允许 workflow 把 dist/*.yaml 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (download → geo → tcp → mihomo → sync)
        env:
          GITHUB_ACTIONS: "true"   # 让 sync 步骤走 CI 模式（写 dist/ 而非 Obsidian）
        run: python run_daily_pipeline.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*.yaml dist/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "proxy: daily update $(date +%F)"
            git push
          fi
